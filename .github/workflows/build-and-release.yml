name: Build APK and Create GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  unit-tests:
    uses: zhenya-mamenko/sip-happens/.github/workflows/unit-tests.yml@main

  integration-tests:
    uses: zhenya-mamenko/sip-happens/.github/workflows/integration-tests.yml@main

  build:
    name: Install and build
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > release.keystore
          $ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner sign \
            --ks release.keystore \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --out sip-happens.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Generate release notes
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          awk -v version="$version" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.txt

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: sip-happens.apk
          token: ${{ secrets.RELEASE_TOKEN }}
          body_path: ${{ github.workspace }}/release-notes.txt
          draft: false
          prerelease: false
          make_latest: true
